<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell | Coming soon</title>
<meta name="description" content="Inkwell is a blog platform API built with Java and Spring Boot. Coming soon.">
<style>
:root{--bg:#141413;--card:#1f1e1d;--line:#3a3935;--text:#faf9f5;--muted:#c4c1b6;--accent:#e08a66}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.6}
main{width:100%;max-width:880px;display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:center}
h1{margin:0 0 20px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(3.5rem,11vw,6.5rem);line-height:1;font-weight:700}
.cursor{display:inline-block;width:.08em;height:.8em;margin-left:.08em;background:var(--accent);vertical-align:baseline;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
p{margin:0 0 28px;font-size:1.15rem;color:var(--muted);max-width:34ch}
nav{display:flex;flex-wrap:wrap;gap:12px 24px}
a{color:var(--text);text-underline-offset:4px;text-decoration-color:var(--accent)}
a:hover{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
pre{margin:0;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;line-height:1.7;color:var(--muted);overflow-x:auto}
.k{color:var(--accent)}
@media (max-width:720px){main{grid-template-columns:1fr;gap:36px}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
</head>
<body>
<main>
<section>
<h1>Inkwell<span class="cursor" aria-hidden="true"></span></h1>
<p>A blog platform API built with Java and Spring Boot. Coming soon.</p>
<nav>
<a href="https://anovid.com">anovid.com</a>
<a href="https://github.com/pratik20gb">GitHub</a>
<!-- TODO: replace YOUR_HANDLE with your real X handle -->
<a href="https://x.com/YOUR_HANDLE">Follow the build on X</a>
</nav>
</section>
<pre aria-label="Sample API response">GET /api/posts

{
  <span class="k">"project"</span>: "Inkwell",
  <span class="k">"status"</span>: "coming soon"
}</pre>
</main>
</body>
</html>
